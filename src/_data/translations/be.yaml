lang: be
title: No Meat Proxy
description: ШІ — гэта інструмент. А вы — не.
ogSiteName: No Meat Proxy
ogImageAlt: 'Лагатып No Meat Proxy і слоган па-англійску: AI is a tool. You shouldn''t be.'
brand:
  logoAlt: Лагатып No Meat Proxy
hook: ШІ — гэта інструмент. А вы — не.
example1:
  heading: Не перасылайце людзям адказы ШІ як ёсць
  dontLabel: ✕ Не варта
  doLabel: ✓ Лепш так
  question: Прывітанне! Як працуюць пераключальнікі фіч? Ці можна наладзіць іх для асобных карыстальнікаў?
  dontAnswer: >-
    Сістэма пераключальнікаў фіч тут — уласная рэалізацыя на аснове канфігурацыі. Азначэнне:
    клас FeatureToggles — data class з булевымі палямі (напрыклад, enableNewCheckoutFlow,
    useOptimizedSearchIndex), пазначаны @ConfigurationProperties і зарэгістраваны праз
    @EnableConfigurationProperties у класе FeatureConfig. Выкарыстанне: унесці FeatureToggles
    і абраць галіну па значэнні ўласцівасці, напрыклад, калі !featureToggles.enableNewCheckoutFlow,
    выкінуць ForbiddenException. Адны пераключальнікі вядуць да датэрміновага вяртання або
    выключэння, іншыя цалкам мяняюць рэалізацыю. Канфігурацыя захоўваецца ў звычайным YAML па
    шляху app.feature-toggles.*, з перавызначэннямі для асобных профіляў, а паколькі гэта
    стандартныя @ConfigurationProperties, значэнні можна перавызначаць яшчэ і праз зменныя
    асяроддзя. Таму пры сённяшняй рэалізацыі ўключаць функцыю для асобных карыстальнікаў
    нельга.
  doAnswer: На жаль, не. Гэта жорстка заданы пераключальнік «уключана / выключана».
  paragraph1: >-
    Калі проста паўтарыць адказ ШІ, чалавеку, які задаў пытанне, стане толькі цяжэй. Адказы ШІ
    часта бываюць занадта доўгімі, заблытанымі і поўнымі дэталяў, пра якія ніхто не пытаўся.
    Да вас звярнуліся, бо давяраюць вашаму меркаванню. Перасылаючы вывад ШІ без зменаў, вы
    толькі перадаяце паведамленні. Вы становіцеся Мясным Проксі.
  paragraph2: Калі вы толькі перадаяце паведамленні паміж людзьмі і ШІ, якую карысць вы прыносіце?
  consequencesIntro: 'Перасылаючы адказы ШІ, вы:'
  consequences:
    - ускладняеце жыццё астатнім.
    - паказваеце, што вас лёгка замяніць.
    - насамрэч нікому не дапамагаеце.
    - выглядаеце непрафесійна.
    - падрываеце давер да сябе.
  avoidHeading: 'Чаго яшчэ варта пазбягаць:'
  avoidList:
    - Не «ўдзельнічайце» ў абмеркаванні, устаўляючы велізарныя адказы ШІ.
    - >-
      Не задавайце пытанні ў духу «Прывітанне, у мяне такая праблема: ».
  insteadHeading: 'Што рабіць замест гэтага:'
  insteadList:
    - Чытайце і правярайце вывад ШІ.
    - Фармулюйце адказы і пытанні самі.
    - Удзельнічайце ў абмеркаванні, калі вам ёсць што сказаць па сутнасці.
  closing: Адказвайце людзям самі. Стаўцеся да людзей па-чалавечы. Не будзьце Мясным Проксі!
example2:
  heading: Не здавайце працу, створаную ШІ, якую вы не разумееце або не праверылі
  dontLabel: ✕ Не варта
  doLabel: ✓ Лепш так
  reviewComment1: Чаму мы ігнаруем гэтую памылку, а не перадаём яе далей?
  dontReviewComment2: лол, не ведаю, гэта Claude напісаў.
  doReviewComment2: >-
    Вышэйстаячы сэрвіс паўтарае запыт пры любой выкінутай памылцы, а гэтая чакана ўзнікае пры
    апрацоўцы старых даных. Таму мы лагуем яе і не перадаём далей, каб не выклікаць лавіну
    паўторных спроб. Дадам каментарый. Ці стварыць задачу ў бэклогу на перапрацоўку
    вышэйстаячага сэрвісу, калі з'явіцца час?
  paragraph1: >-
    Нават калі большую частку працы зрабіў ШІ, адказнасць усё роўна на вас, і пад вынікам стаіць
    ваша імя. А калі стаіць ваша імя, гэта ваша праца. Вы адказваеце за тое, каб разумець,
    правяраць і прымаць на сябе адказнасць за зробленае.
  consequencesIntro: 'Бяздумна здаючы працу ШІ, вы:'
  consequences:
    - перакладаеце на іншых неабходнасць разбірацца ў вашай працы і правяраць яе.
    - праяўляеце непавагу, прымушаючы іншых рабіць тое, пра што самі не паклапаціліся.
    - паказваеце іншым, што вашу працу трэба перарабляць.
    - выглядаеце непрафесійна.
    - дэманструеце, наколькі лёгка вас замяніць.
  avoidHeading: 'Чаго яшчэ варта пазбягаць:'
  avoidList:
    - Не адказвайце на заўвагі да вашай працы адказамі ШІ.
    - Не вінавацьце ШІ, калі атрымліваеце заўвагі.
    - Не апраўдвайце недахоп ведаў словамі «гэта зрабіў ШІ».
    - Не зніжайце планку якасці толькі таму, што ўдзельнічаў ШІ.
  insteadHeading: 'Што рабіць замест гэтага:'
  insteadList:
    - Прачытайце, зразумейце і праверце зробленае.
    - Адказвайце на заўвагі як аўтар працы.
    - >-
      Адказвайце за працу так, нібы яна цалкам ваша (пад ёю стаіць ваша імя, значыць, яна ваша).
    - Паказвайце іншым, што вам не ўсё адно, чым вы займаецеся.
  closing: >-
    Адказвайце за працу, пад якой стаіць ваша імя. Будзьце чалавекам, на якога можна
    спадзявацца. Не будзьце Мясным Проксі.
