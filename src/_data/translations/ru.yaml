lang: ru
title: No Meat Proxy
description: ИИ — инструмент. Вы — нет.
ogSiteName: No Meat Proxy
ogImageAlt: 'Логотип No Meat Proxy и слоган на английском: AI is a tool. You shouldn''t be.'
brand:
  logoAlt: Логотип No Meat Proxy
hook: ИИ — инструмент. А вы — нет.
example1:
  heading: Не пересылайте людям ответы ИИ как есть
  dontLabel: ✕ Не стоит
  doLabel: ✓ Лучше так
  question: Привет! Как работают переключатели фич? Можно настроить их для отдельных пользователей?
  dontAnswer: >-
    Здесь используется собственная система переключателей фич на основе конфигурации.
    Определение: класс FeatureToggles — data class с булевыми полями (например,
    enableNewCheckoutFlow и useOptimizedSearchIndex), помеченный @ConfigurationProperties
    и зарегистрированный через @EnableConfigurationProperties в классе FeatureConfig.
    Использование: внедрить FeatureToggles и выбрать ветку по значению свойства. Например,
    если !featureToggles.enableNewCheckoutFlow, выбросить ForbiddenException. Одни
    переключатели приводят к досрочному возврату или исключению, другие полностью меняют
    реализацию. Конфигурация хранится в YAML по пути app.feature-toggles.*; значения можно
    переопределять для отдельных профилей, а благодаря @ConfigurationProperties — ещё и через
    переменные окружения. Поэтому в текущей реализации включать функцию для отдельных
    пользователей нельзя.
  doAnswer: 'Нет. Сейчас это жёстко заданный переключатель: фича либо включена для всех, либо выключена.'
  paragraph1: >-
    Если просто повторить ответ ИИ, человеку, который задал вопрос, станет только сложнее.
    Ответы ИИ часто бывают слишком длинными, запутанными и полными деталей, о которых
    никто не спрашивал. К вам обратились, потому что доверяют вашему суждению.
    Пересылая вывод ИИ без изменений, вы лишь передаёте сообщения. Вы превращаетесь в Мясной Прокси.
  paragraph2: Если вы только передаёте сообщения между людьми и ИИ, какую пользу вы приносите?
  consequencesIntro: 'Пересылая ответы ИИ как есть, вы:'
  consequences:
    - усложняете работу другим.
    - показываете, что вас легко заменить.
    - на самом деле никому не помогаете.
    - выглядите непрофессионально.
    - подрываете доверие к себе.
  avoidHeading: 'Чего ещё стоит избегать:'
  avoidList:
    - Не «участвуйте» в обсуждении, вставляя огромные ответы ИИ.
    - 'Не задавайте вопросы в духе: «Привет, у меня такая проблема: <огромный текст, сгенерированный ИИ>».'
  insteadHeading: 'Что делать вместо этого:'
  insteadList:
    - Читайте и проверяйте ответы ИИ.
    - Формулируйте ответы и вопросы своими словами.
    - Участвуйте в обсуждении, когда вам есть что добавить по существу.
  closing: Отвечайте людям сами. Относитесь к ним по-человечески. Не будьте Мясным Прокси!
example2:
  heading: Не сдавайте работу, созданную с помощью ИИ, которую не понимаете или не проверили
  dontLabel: ✕ Не делайте так
  doLabel: ✓ Намного лучше так
  reviewComment1: Почему мы игнорируем эту ошибку, а не передаём дальше?
  dontReviewComment2: лол, не знаю, это Клод написал.
  doReviewComment2: >-
    Вышестоящий сервис повторяет запрос при любой ошибке, а эта ошибка ожидаема при
    обработке старых данных. Поэтому мы пишем её в лог и не передаём дальше,
    чтобы не вызвать лавину повторных попыток. Добавлю комментарий. Мне создать задачу
    на переделку вышестоящего сервиса, когда появится время?
  paragraph1: >-
    Даже если большую часть работы сделал ИИ, ответственность всё равно на вас:
    под результатом стоит ваше имя. Значит, это ваша работа. Вам нужно понимать,
    проверять и принимать на себя ответственность за сделанное.
  consequencesIntro: 'Слепо сдавая работу ИИ, вы:'
  consequences:
    - перекладываете на других задачу разобраться в вашей работе и проверить её.
    - проявляете неуважение, заставляя других делать то, на что сами не потратили время.
    - показываете, что вашу работу нужно перепроверять.
    - выглядите непрофессионально.
    - показываете, что вас легко заменить.
  avoidHeading: 'Чего ещё стоит избегать:'
  avoidList:
    - Не отвечайте на замечания к своей работе текстом от ИИ.
    - Не вините ИИ, когда получаете замечания.
    - Не оправдывайте своё незнание словами «это сделал ИИ».
    - Не снижайте требования к качеству только потому, что использовали ИИ.
  insteadHeading: 'Что делать вместо этого:'
  insteadList:
    - Прочитайте, поймите и проверьте сделанное.
    - Отвечайте на замечания как автор работы.
    - 'Относитесь к результату как к собственной работе: под ним стоит ваше имя.'
    - Покажите другим, что вам важно качество своей работы.
  closing: Отвечайте за работу, под которой стоит ваше имя. Будьте человеком, на которого можно положиться. Не будьте Мясным Прокси.
